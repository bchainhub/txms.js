name: Feature request 🔮
description: Suggest an idea for this project
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea for this project for the developers to consider.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Please describe it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives you've considered.

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Describe the implementation and include a code example.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Provide any additional context or screenshots.
